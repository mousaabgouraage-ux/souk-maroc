services:
  app:
    build: .
    container_name: suma-market
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL}"
      DIRECT_URL: "${DIRECT_URL}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      AUTH_SECRET: "${AUTH_SECRET}"
    env_file:
      - .env
    # تعديل الصور المرفوعة يُخزن على قرص دائم على الخادم
    volumes:
      - suma-uploads:/app/public/uploads

volumes:
  suma-uploads: